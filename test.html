<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Drive Video</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        iframe {
            width: 80vw;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            border: none;
        }
    </style>
</head>
<body>
<h1>Google Drive Video</h1>
<p>This is a simple video player for Google Drive videos.</p>
    <iframe
        src="https://drive.google.com/file/d/1Jl1oqAUiZQEtqDgtXNV0bOYfpGiDfW1A/preview"
        allow="autoplay"
        allowfullscreen>
    </iframe>

</body>
</html>
